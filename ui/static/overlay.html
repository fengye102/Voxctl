<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxctl 状态</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Voxctl 状态浮窗（光圈，CLAUDE.md §8.11 / 修订 26）
   离线自足：无 CDN / 无 webfont / 无图片资产，纯 CSS @keyframes。
   状态由 GUI 端 state_tailer 经 pywebview evaluate_js 调 window.setState() 推入。
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --idle:    #9AA0A6;   /* 灰：待机 */
  --listen:  #F2453D;   /* 红：监听（脉冲呼吸） */
  --asr:     #3a3f4a;   /* 深板岩：识别（玻璃盘 + 六彩点） */
  --execute: #8B5CF6;   /* 紫：执行（旋转环） */
  --tts:     #10B981;   /* 绿：播报（波形） */
  --confirm: #F5A623;   /* 黄：等待确认（闪烁） */
  --error:   #F2453D;   /* 红：错误（闪烁） */
  --c: var(--idle);     /* 当前状态色，由 body.state-* 覆盖，玻璃球读它 */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  cursor: pointer;   /* 修订 33：点击光圈 toggle 语音启停 */
}
/* 修订 31：macOS 毛玻璃通透质感。
   WinForms WebView2 无法真透明（桌面透不过来，见 overlay_window.py docstring），
   窗口被 SetWindowRgn 裁成正圆——所以不靠背景虚化，而是把这枚**不透明圆**本身
   用分层 CSS 渐变塑成一颗玻璃珠：球面景深底 + 高光镜面 + 内缘光环 + 白纱通透层。
   body 只做居中容器 + 裁剪外暗底填充（圆外被裁掉，不可见）。 */
body {
  display: flex; align-items: center; justify-content: center;
  background: #14161a;
  --c: var(--idle);
}

/* 玻璃球主体：固定 80×80 居中（= SetWindowRgn 裁出的正圆直径，随 DPI 同比缩放对齐）。
   修订 32：iOS Siri 哑光通透球体。塑料感来自「单层径向渐变 + 单点高光」；
   这里改成分层次表面散射 + feTurbulence 颗粒 + 柔和多层高光 + 边缘渐隐，四条一起做。 */
.dot {
  position: relative;
  width: 80px; height: 80px;
  flex-shrink: 0;
  border-radius: 50%;
  /* 背景分层（前→后）：
     1) feTurbulence 灰噪点（内联 SVG data URI，离线自足）——用 background-blend-mode
        soft-light 与下方所有层混合，打破纯色渐变的光滑塑料感 = 毛细血管/哑光颗粒核心。
     2) 顶部柔和镜面：大而淡的椭圆光，不是白点（次表面透光的镜面反射）。
     3) 内部透光核：从球心偏上「透」出的亮，模拟光从内部散射出来（sub-surface scattering）。
     4) 底部景深暗：体积感。
     5) 球体色底：上浅下深连续过渡。
     颗粒层还顺带抖掉小尺寸渐变色带（dithering），一举两得。 */
  background:
    url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='120'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='120'%20height='120'%20filter='url(%23n)'/%3E%3C/svg%3E"),
    radial-gradient(58% 44% at 38% 20%, rgba(255,255,255,.42), rgba(255,255,255,.10) 42%, rgba(255,255,255,0) 74%),
    radial-gradient(78% 78% at 50% 42%, color-mix(in srgb, var(--c) 52%, #ffffff 48%), rgba(255,255,255,0) 68%),
    radial-gradient(95% 85% at 50% 110%, rgba(0,0,0,.34), rgba(0,0,0,0) 62%),
    radial-gradient(125% 120% at 50% 28%,
        color-mix(in srgb, var(--c) 84%, #ffffff 16%),
        var(--c) 54%,
        color-mix(in srgb, var(--c) 80%, #000000 20%));
  background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  background-size: 120px 120px, auto, auto, auto, auto;
  background-blend-mode: soft-light, normal, normal, normal, normal;
  /* 内缘光：顶内缘柔亮 + 底内缘柔暗 + 整体内收柔暗；去掉硬 1px 白边（那正是廉价轮廓线）。 */
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.32),
    inset 0 -6px 12px rgba(0,0,0,.26),
    inset 0 0 9px rgba(0,0,0,.16);
  /* 边缘渐隐：外圈 ~8% 羽化到透明，避免 SetWindowRgn 硬圆的生硬轮廓线。 */
  -webkit-mask: radial-gradient(closest-side, #000 92%, rgba(0,0,0,0) 100%);
          mask: radial-gradient(closest-side, #000 92%, rgba(0,0,0,0) 100%);
  transition: background-color .28s ease;
}


/* 旋转环（EXECUTE）：修订 30 改为圆点**内**一圈缺口环——inset 正值收进圆内，
   否则超出圆的部分被 SetWindowRgn 裁掉，环会缺口。 */
.dot::before {
  content: "";
  position: absolute; inset: 14px;
  border-radius: 50%;
  border: 3px solid transparent;
  opacity: 0;
  transition: opacity .2s ease;
}
/* 波形/闪烁等叠加层（TTS 同心圆，收在圆内扩散） */
.dot::after {
  content: "";
  position: absolute; inset: 10px;
  border-radius: 50%;
  opacity: 0;
}

/* ───── 状态配色：只改玻璃球的 --c，多层高光/景深随之重算，玻璃质感一致 ─────
   状态 class 挂在 body，动画挂 .dot（玻璃球本体）。 */
.state-idle    { --c: var(--idle); }
.state-listen  { --c: var(--listen); }
.state-execute { --c: var(--execute); }
.state-tts     { --c: var(--tts); }
.state-confirm { --c: var(--confirm); }
.state-error   { --c: var(--error); }

/* ───── LISTEN：红玻璃球，脉冲呼吸 ─────
   box-shadow 外发光超出圆会被 SetWindowRgn 裁掉（不透明圆窗无法外发光，
   是圆形裁剪方案的固有取舍），呼吸靠 scale + 玻璃色感表达。 */
.state-listen .dot {
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%   { transform: scale(1); }
  70%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* ───── ASR：openless ThinkingDots 6 点圆环（修订 27，翻译自 ThinkingDots.tsx） ─────
   原「蓝点 + 白缺口环」已替换为 6 彩点绕圆心旋转 + 呼吸；
   参数与 openless ThinkingDots.tsx 1:1（size 48 / dot 8.16 / radius 14.88）。
   .thinking-dots 默认 display:none，仅 .state-asr 下显示；原 .dot 同步隐藏。 */
.thinking-dots {
  position: relative;
  width: 48px; height: 48px;
  display: none;
  animation: ol-thinking-spin 1.7s linear infinite,
             ol-thinking-breathe 2.8s ease-in-out infinite;
  will-change: transform;
}
.thinking-dots span {
  position: absolute;
  left: 50%; top: 50%;
  width: 8.16px; height: 8.16px;   /* max(2.5, size*0.17) */
  margin: -4.08px 0 0 -4.08px;     /* -dot/2 */
  border-radius: 999px;
}
.thinking-dots span:nth-child(1) { transform: rotate(0deg)   translateY(-14.88px); background: #5b8def; }
.thinking-dots span:nth-child(2) { transform: rotate(60deg)  translateY(-14.88px); background: #8b6ff2; }
.thinking-dots span:nth-child(3) { transform: rotate(120deg) translateY(-14.88px); background: #c96fd6; }
.thinking-dots span:nth-child(4) { transform: rotate(180deg) translateY(-14.88px); background: #e08787; }
.thinking-dots span:nth-child(5) { transform: rotate(240deg) translateY(-14.88px); background: #d9a75f; }
.thinking-dots span:nth-child(6) { transform: rotate(300deg) translateY(-14.88px); background: #5fb8a8; }
@keyframes ol-thinking-spin {
  to { transform: rotate(360deg); }
}
@keyframes ol-thinking-breathe {
  0%, 100% { scale: 1; opacity: 1; }
  50%      { scale: .82; opacity: .8; }
}
@media (prefers-reduced-motion: reduce) {
  .thinking-dots { animation: none; }
}

/* ASR：玻璃球换深板岩色底（--asr）让 6 枚彩点读得清，玻璃球隐藏、露六彩点 */
.state-asr { --c: var(--asr); }
.state-asr .dot { display: none; }
.state-asr .thinking-dots { display: block; }

/* ───── EXECUTE：紫玻璃球，内旋转环 ───── */
.state-execute .dot::before {
  opacity: 1;
  border-top-color: rgba(255,255,255,.95);
  border-right-color: rgba(255,255,255,.35);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ───── TTS：绿玻璃球，波形（同心圆扩散） ───── */
.state-tts .dot::after {
  opacity: 1;
  border: 2px solid rgba(255,255,255,.6);
  animation: wave 1.1s ease-out infinite;
}
@keyframes wave {
  0%   { transform: scale(.6); opacity: .7; }
  100% { transform: scale(1); opacity: 0; }
}

/* ───── AWAIT_CONFIRM：黄玻璃球，闪烁 ───── */
.state-confirm .dot {
  animation: blink 0.7s steps(1, end) infinite;
}
/* ───── 错误：红玻璃球，闪烁（更快） ───── */
.state-error .dot {
  animation: blink 0.35s steps(1, end) infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: .35; }
}

/* 可选文字气泡（识别文本），默认不占位；这里先不显示避免泄露/挡视线，
   保留 hook 以后需要再开（§8.11：浮窗不显示敏感信息） */
.label { display: none; }
</style>
</head>
<body class="state-idle">
  <div class="dot" id="dot"></div>
  <div class="thinking-dots" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="label" id="label"></div>

<script>
/* ═══ 状态机 → CSS class 映射 ═══════════════════════════════════════
   state_tailer 解析出的协议对象经 evaluate_js 调 window.applyEvent(obj)。
   为兼容 evaluate_js 的字符串传参，另提供 window.setState(json 字符串)。
   ─────────────────────────────────────────────────────────────────── */
(function () {
  var STATE_CLASS = {
    idle: "state-idle",
    listen: "state-listen",
    asr: "state-asr",
    execute: "state-execute",
    tts: "state-tts",
    await_confirm: "state-confirm",
  };
  var ALL_CLASSES = [
    "state-idle", "state-listen", "state-asr", "state-execute",
    "state-tts", "state-confirm", "state-error",
  ];

  // 最短显示时长（ms）：ASR/EXECUTE 200ms、错误 500ms，避免一闪而过看不清。
  var MIN_HOLD = { asr: 200, execute: 200, "state-error": 500 };
  var _lastApplied = 0;          // 上次 apply 的时间戳
  var _lastHoldMs = 0;           // 上次状态要求的最短保持
  var _pending = null;           // 被最短保持压住、待应用的下一个 class
  var _pendingTimer = null;

  function _setClass(cls, holdMs) {
    var body = document.body;
    for (var i = 0; i < ALL_CLASSES.length; i++) body.classList.remove(ALL_CLASSES[i]);
    body.classList.add(cls);
    _lastApplied = Date.now();
    _lastHoldMs = holdMs || 0;
  }

  function _requestClass(cls, holdMs) {
    var now = Date.now();
    var elapsed = now - _lastApplied;
    if (elapsed >= _lastHoldMs) {
      // 上一个状态已满足最短保持，立即切
      if (_pendingTimer) { clearTimeout(_pendingTimer); _pendingTimer = null; }
      _pending = null;
      _setClass(cls, holdMs);
    } else {
      // 还在最短保持里，记为待应用，到点再切（若期间又来新的，覆盖 pending）
      _pending = { cls: cls, holdMs: holdMs };
      if (!_pendingTimer) {
        _pendingTimer = setTimeout(function () {
          _pendingTimer = null;
          if (_pending) {
            var p = _pending; _pending = null;
            _setClass(p.cls, p.holdMs);
          }
        }, _lastHoldMs - elapsed);
      }
    }
  }

  window.applyEvent = function (obj) {
    if (!obj || typeof obj !== "object") return;
    var event = obj.event;
    if (event === "error") {
      _requestClass("state-error", MIN_HOLD["state-error"]);
      return;
    }
    if (event === "exit") {
      _requestClass("state-idle", 0);
      return;
    }
    if (event === "state") {
      var cls = STATE_CLASS[obj.state] || "state-idle";
      _requestClass(cls, MIN_HOLD[obj.state] || 0);
      return;
    }
    // asr_text / tts_text：当前不显示文字（§8.11 不泄露），忽略
  };

  // evaluate_js 传字符串更稳（跨 webview 后端一致），这里做 JSON 解析入口
  window.setState = function (jsonStr) {
    try {
      window.applyEvent(typeof jsonStr === "string" ? JSON.parse(jsonStr) : jsonStr);
    } catch (e) { /* 脏数据忽略 */ }
  };

  // ─── 点击 toggle 语音启停（修订 33） ───
  // WS_EX_NOACTIVATE 只挡「点击把窗口激活到前台」，鼠标消息仍会送到光圈下的
  // WebView2 → 这里的 click 照常触发；焦点留在原应用（记事本光标不丢），二者共存。
  // 走 pywebview.api.toggle()（webui.gui 的 OverlayBridge 暴露）；桥不在时静默 no-op，
  // 独立 run.bat 跑语音（无 GUI）时点击无害。防抖 400ms 避免误连点两次启停打架。
  var _clickLock = false;
  function _onOverlayClick() {
    if (_clickLock) return;
    var api = window.pywebview && window.pywebview.api;
    if (!api || typeof api.toggle !== "function") return;
    _clickLock = true;
    setTimeout(function () { _clickLock = false; }, 400);
    try {
      var r = api.toggle();
      if (r && typeof r.then === "function") { r.catch(function () {}); }
    } catch (e) { /* 桥异常忽略，不影响浮窗展示 */ }
  }
  document.body.addEventListener("click", _onOverlayClick);
})();
</script>
</body>
</html>
