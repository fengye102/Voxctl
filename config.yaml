audio:
  # sounddevice 输入设备索引。
  # null = 首次运行会打印设备列表并使用系统默认输入，建议填入实际索引（CLAUDE.md §8.2）
  # 运行 `python -m tests.acceptance.test_recorder_vad` 会打印可用设备列表。
  input_device_index: null
  # 输出设备模式：auto / headphone / speaker（CLAUDE.md §8.5）
  # auto = 启动时根据设备名关键词自动检测，检测失败默认按 speaker 处理
  output_mode: auto

vad:
  # 静默监听阈值（0–1）：概率 >= 此值视为有人声（CLAUDE.md §2 VAD 选型）
  silence_threshold: 0.5
  # 打断判定阈值——耳机模式（播报不泄漏，可以低一点）
  interrupt_threshold_headphone: 0.6
  # 打断判定阈值——外放模式（泄漏严重，必须保守）
  interrupt_threshold_speaker: 0.85
  # 连续多少帧 >= threshold 才确认"语音开始"（过滤瞬间噪音）
  speech_confirm_frames: 3
  # 连续多少帧 < threshold 才确认"语音结束"（约 480ms @ 32ms/frame）
  silence_confirm_frames: 15
  # 自适应阈值：根据环境噪声自动抬高 silence_threshold（仅 LISTEN 模式）
  # 安静环境下无影响；噪声环境自动提高阈值，减少误触发
  adaptive_threshold: true
  # 自适应余量：噪声基线 p95 上方的安全间距（0.05-0.15 范围调整）
  adaptive_margin: 0.10
  # 外放模式打断开关（修订 47，CLAUDE.md §8.4）：
  #   false = speaker 模式下关闭打断监听（单向播报，TTS 期间不跑 InterruptCoordinator）
  #           实测 silero-vad 对 TTS 泄漏概率 0.88-0.97，调阈值无效，默认关闭避免误触发
  #   true  = 启用外放打断（接受误触发风险，需配合高阈值 + speech_confirm_frames）
  # headphone 模式不受此开关影响，始终启用打断
  speaker_interrupt_enabled: false
  # ─── 打断阈值调优指南（Step 8） ───────────────────────────────────
  # 症状 → 调整方向：
  #  - 误触发打断（播报时自己打断自己）：调高 interrupt_threshold_*
  #  - 打断不灵敏（用户说话后播报不停）：调低 interrupt_threshold_*
  #  - 键盘声/咳嗽声误触发：调高 speech_confirm_frames（3-4 帧）
  #  - 打断响应慢（说完话等半秒才停）：调低 speech_confirm_frames（1 帧）
  # 实测建议：
  #  - 耳机模式：interrupt_threshold_headphone 0.5-0.7，speech_confirm_frames 2
  #  - 外放模式：interrupt_threshold_speaker 0.75-0.85，speech_confirm_frames 2-3
  #  - 极易误触发的笔记本内置麦克风：可调到 0.85/3
  # 调优依据：日志里的 VAD interrupt triggered 行（prob=X, threshold=Y, consecutive=Z）

asr:
  # ASR provider（CLAUDE.md §2.2）：local = 本地 faster-whisper（默认）/ openai = 云端 OpenAI 兼容
  # 云端只做 OpenAI 格式（Anthropic 无音频端点），下面 model/api_key_env/base_url/timeout 仅 provider=openai 时生效
  provider: local
  # faster-whisper 模型大小：base / small（约 500MB）/ medium（约 1.5GB）/ large
  # 默认 medium（修订 72）：small 实测 CER 14.8%~23% 不达标；medium CER 达标但
  # CPU 单句 4~5s，端到端延迟记为已知限制（CLAUDE.md §2 / §7）
  model_size: medium
  device: cpu   # cpu / cuda，MVP 固定 cpu
  compute_type: int8   # CPU 下 int8 最快，质量损失可忽略
  # ASR 识别语言：传给 faster-whisper 的 language 参数
  # zh = 中文（默认），en = 英文，ja = 日文……完整列表见 Whisper 文档
  # 改此项即可让语音助手识别其他语言（TTS/LLM/白名单等暂不联动，见 CLAUDE.md §4）
  language: zh
  # 繁简转换：Whisper 中文模型对大陆普通话有时输出繁体字符，用 opencc t2s 字符级转换
  # true = 启用（推荐）；false = 禁用（仅在排查 opencc 问题时关闭）
  opencc_enabled: true
  # --- 以下仅 provider=openai 时生效（云端 ASR，CLAUDE.md §2.2 / §8.12）---
  model: whisper-1              # 云端模型标识（中转站可能是自定义别名）
  api_key_env: OPENAI_API_KEY  # 从环境变量读取 key，不写明文（§6 铁律）
  base_url: ""                 # 留空 = 官方端点；填中转站 URL 前先验证 /v1/audio/transcriptions（§8.9）
  timeout: 30                  # 单次请求超时秒数

llm:
  # provider 决定实例化哪个 LLMClient 实现（CLAUDE.md §2.1）
  provider: anthropic           # anthropic / openai
  model: claude-haiku-4-5-20251001
  # API Key 从环境变量读取，不写明文（CLAUDE.md §2 API Key 管理）
  api_key_env: ANTHROPIC_API_KEY
  # 留空 = 走官方端点；填中转站 URL 时需提前验证 tool use 支持（CLAUDE.md §8.9）
  # 中转站 URL 只填根域名，SDK 会自动拼接 /v1/messages 路径
  # 默认留空：新环境/他人克隆不绑个人中转（修订 47）
  base_url: ""
  # 单次请求超时秒数（中转站比官方端点慢，给足时间避免误报超时）
  # SDK 默认还会重试 2 次，总耗时最多 ≈ timeout × 3 + 退避
  timeout: 30

tts:
  # TTS provider（CLAUDE.md §2.2）：edge = 本地 edge-tts（默认）/ openai = 云端 OpenAI 兼容
  # 云端只做 OpenAI 格式（Anthropic 无音频端点），下面 model/tts_voice/api_key_env/base_url/timeout 仅 provider=openai 时生效
  provider: edge
  voice: zh-CN-XiaoxiaoNeural    # Edge TTS 中文音色（provider=edge 时用）
  # pyttsx3 本地后备：edge-tts / 云端 TTS 失败时自动降级到 SAPI5 本地引擎（修订 34/45）
  local_fallback: true
  # --- 以下仅 provider=openai 时生效（云端 TTS，CLAUDE.md §2.2）---
  model: tts-1                 # 云端模型标识（中转站可能是自定义别名）
  tts_voice: alloy             # 云端音色（OpenAI: alloy/echo/fable/onyx/nova/shimmer）
  api_key_env: OPENAI_API_KEY  # 从环境变量读取 key，不写明文（§6 铁律）
  base_url: ""                 # 留空 = 官方端点；填中转站 URL 前先验证 /v1/audio/speech（§8.9）
  timeout: 30                  # 单次请求超时秒数

ui:
  # 全局键盘热键 toggle 语音启停（CLAUDE.md §6 / 修订 33；修订 50 起浮窗已删，热键是唯一 toggle 入口之一，另入口是 GUI 控制台按钮）
  #   格式：修饰键 + 主键，用 + 连接，如 "ctrl+alt+v" / "ctrl+shift+space"
  #   修饰键支持 ctrl / alt / shift / win；GUI 控制台可改，覆盖写入 voxctl.local.yaml
  hotkey: "ctrl+alt+v"
  #   false = 不注册全局热键；热键被占用时启动会记日志并跳过
  hotkey_enabled: true
  # 系统托盘状态图标（修订 59）：只展示监听/识别/执行/播报状态，无点击操作
  tray_enabled: true

plugins:
  # 插件机制总开关（修订 42）：true = 扫描 plugins/ 加载自定义意图；false = 不加载
  enabled: true

wake_word:
  # 唤醒词（修订 56）：true = 每条指令须以唤醒词开头才处理，压低常开监听误触发
  #   false = 纯 VAD 激活（不影响既有使用）
  enabled: true
  # 唤醒词短语（归一化后前缀匹配，命中即剥离，剩余部分作为指令继续解析）
  phrases:
    - 嘿维鸥
    - 维鸥
  # 只说唤醒词、无后续指令时，是否轻应一声"在"
  ack_on_bare: true

dictation:
  # 听写模式（修订 56）：说"进入听写"后，识别文本直接注入当前光标窗口（只打字面字符，
  # 绝不发回车/Tab/修饰键，§6 安全边界）；说下列任一短语退出（关键词匹配，不走 LLM）
  exit_phrases:
    - 退出听写
    - 停止听写
    - 结束听写

context:
  # 多轮上下文（修订 56）：true = 把上一条成功指令摘要传给 LLM，辅助"关闭它"类指代消解
  #   false = 每句独立处理（旧 §4 行为）。仅影响指代解析，不放松结构化输出约束
  multi_turn: true

metrics:
  # 度量埋点（修订 56）：true = 每轮把各阶段延迟（asr/intent/exec/说完→播报 毫秒）
  # 写进 logs/actions.log（event="metrics"），用于量化核对 §7 延迟指标
  enabled: true

whitelist:
  # 打开应用放开开关（CLAUDE.md §6 修订 15）：
  #   true  = 打开任意已安装应用（开始菜单 + App Paths 索引，apps 别名表优先）
  #   false = 打开也只限 apps 白名单（旧行为）
  # 关闭应用/命令/文件路径不受此开关影响，始终 100% 白名单强制
  allow_open_any_app: true
  # apps 现在是"优先别名表"（修订 15）：用户口语名 → 路径，索引查不到的名字在这里补
  # （如系统程序 notepad 没有开始菜单快捷方式，中文名"记事本"必须靠别名）
  apps:
    chrome: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    notepad: 'C:\Windows\System32\notepad.exe'
    记事本: 'C:\Windows\System32\notepad.exe'
    浏览器: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    计算器: 'C:\Windows\System32\calc.exe'
  # 每条命令需标注 dangerous: true/false（CLAUDE.md §6）
  # command 用列表形式传给 subprocess，禁止 shell=True 任意拼接（CLAUDE.md §6 明确禁止）
  # name 是 RunCommandIntent.command_name 要匹配的键
  # allow_args（修订 47）：false=拒绝带 args 调用（默认）；true=允许 RunCommandIntent.args 追加到 command 末尾
  #   dangerous: true 的命令强制 allow_args=false（§6 强制），配置里显式写 true 也会被覆盖为 false
  commands:
    - name: lock_screen
      command: ['rundll32.exe', 'user32.dll,LockWorkStation']
      dangerous: false
      allow_args: false
    - name: empty_recycle_bin
      command: ['powershell', '-NoProfile', '-Command', 'Clear-RecycleBin -Force']
      dangerous: true
      allow_args: false   # dangerous 命令强制禁 args（§6 修订 47）
    - name: show_ip
      command: ['powershell', '-NoProfile', '-Command', '(Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias Wi-Fi).IPAddress']
      dangerous: false
      allow_args: false
  paths:
    - "%USERPROFILE%\\Desktop"
    - "%USERPROFILE%\\Documents"
